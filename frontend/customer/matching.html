<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartRide – Finding Driver</title>
    <link rel="stylesheet" href="css/matching.css">
</head>
<body>

<div class="match-container">

    <div class="loader"></div>

    <h2>Finding nearby driver</h2>
    <p class="subtext">Please wait, we are connecting you with a driver</p>

    <div class="summary">
        <p><b>Vehicle:</b> <span id="vehicleText"></span></p>
        <p><b>Pickup:</b> <span id="pickupText"></span></p>
        <p><b>Drop:</b> <span id="dropText"></span></p>
        <p><b>Estimated Fare:</b> ₹<span id="fareText"></span></p>
    </div>

</div>

<script src="js/matching.js"></script>
</body>
</html>
